name: CODMRank
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: 'NO'
targets:
  CODMRank:
    type: application
    platform: iOS
    sources:
      - path: CODMRank.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crismunoz.codmranktracker
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: CODM Rank Tracker
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 4
        CODE_SIGN_STYLE: Manual
schemes:
  CODMRank:
    build:
      targets:
        CODMRank: all
