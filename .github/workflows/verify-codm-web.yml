name: Verify Rank Command web app
on:
  push:
    branches: [codm-rank-tracker]
    paths:
      - 'codm-pwa/**'
      - '.github/workflows/verify-codm-web.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check codm-pwa/app.js
          node --check codm-pwa/meta.js
          node --check codm-pwa/blueprints.js
          node --check codm-pwa/sw.js
          node --check codm-pwa/api/player.js
      - name: Only sourced, supported data is shown
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const text=name=>fs.readFileSync('codm-pwa/'+name,'utf8');
          const html=text('index.html'),js=text('app.js'),css=text('style.css'),sw=text('sw.js');
          const meta=require('./codm-pwa/meta.js');
          const blueprints=require('./codm-pwa/blueprints.js');
          const all=html+js+text('meta.js')+text('blueprints.js');
          assert.ok(!/NOT VERIFIED|NOT CURRENTLY VERIFIED|not verified|unverified/i.test(all));
          assert.ok(!/historical benchmarks|2023 guide|2023 reference/i.test(html));
          for(const forbidden of ['/progression.js','id="metaTTK"','VERIFIED TTK',
            'id="gainChoices"','id="milestones"','id="progressBar"','id="nextTier"',
            'id="blueprintRarityNotStated"','data-blueprint-filter="UNKNOWN"']){
            assert.ok(!html.includes(forbidden),'unsupported visible UI '+forbidden);
          }
          assert.ok(!sw.includes('/progression.js'));
          assert.ok(!js.includes('RANKS.')&&!js.includes('const LEGENDARY'));
          assert.ok(sw.includes('rankcommand-static-v17'));
          for(const item of ['/meta.js','/blueprints.js']){
            assert.ok(sw.includes(item));
            assert.ok(html.includes('src="'+item+'"'));
            assert.ok(html.indexOf(item)<html.indexOf('/app.js'));
          }
          for(const tab of ['command','player','analytics','history','meta']){
            assert.ok(html.includes('data-tab="'+tab+'"'),tab);
          }
          for(const id of ['rankArt','avatar','profileXP','profileNext','currentXP','metaWeapons',
              'metaAttachments','metaSourceLink','metaCopy','modeBlueprints','blueprintList',
              'blueprintDetail','blueprintSource','blueprintRarity','backupBtn','restoreBtn',
              'connectForm','historyList','chart']){
            assert.ok(html.includes('id="'+id+'"'),'missing '+id);
          }
          assert.ok(js.includes('displayArt("rankArt","badgeUnavailable",player.rankArt)'));
          assert.ok(js.includes('displayArt("avatar","avatarFallback",player.pic)'));
          assert.ok(js.includes('function renderBlueprints(){'));
          assert.ok(js.includes('if(entry.rarity)b.append(rarity)'));
          assert.ok(js.includes('$("blueprintRarity").hidden=!selected.rarity'));
          assert.ok(js.includes('switchWeaponMode(weaponMode)'));
          assert.ok(js.includes('localStorage.setItem(STORAGE_PREFIX+uidKey("avatar")'));
          assert.ok(js.includes('function backupHistory()'));
          assert.ok(js.includes('async function restoreHistory(file)'));
          assert.ok(!fs.existsSync('codm-pwa/rank-art.js'));
          assert.equal(meta.entries.length,2);
          for(const item of meta.entries){
            assert.equal(item.attachments.length,5);
            assert.ok(item.url.startsWith('https://'));
            for(const part of item.attachments){
              assert.ok(part.slot.length>1&&part.name.length>2);
            }
            for(const key of ['ttk','ttkStatus','metaRank','published'])
              assert.ok(!Object.hasOwn(item,key),'unsupported Gunsmith field '+key);
          }
          assert.equal(blueprints.length,20);
          const unique=new Set();
          for(const bp of blueprints){
            assert.ok(bp.id&&bp.weapon&&bp.blueprint);
            assert.ok(!unique.has(bp.id),'duplicate blueprint '+bp.id);unique.add(bp.id);
            assert.ok(bp.sourceUrl.startsWith('https://www.callofduty.com/blog/'));
            assert.ok(!Object.hasOwn(bp,'rarity')||['Mythic','Legendary'].includes(bp.rarity));
            for(const forbidden of ['ttkMs','ttkStatus','availability','owned']){
              assert.ok(!Object.hasOwn(bp,forbidden),'unsupported blueprint field '+forbidden);
            }
          }
          assert.ok(css.includes('env(safe-area-inset-top'));
          assert.ok(css.includes('.tabs.dock-retracted'));
          console.log('PASS — documented attachments, official blueprint facts, no guessed TTK, no old-season projections, original rank artwork, account isolation');
          NODE
