name: Verify CODM web rank art
on:
  push:
    branches: [codm-rank-tracker]
    paths:
      - 'codm-pwa/**'
      - '.github/workflows/verify-codm-web.yml'
  workflow_dispatch:
jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all JavaScript syntax
        run: |
          node --check codm-pwa/app.js
          node --check codm-pwa/sw.js
          node --check codm-pwa/api/player.js
      - name: Verify authentic original rank art flow
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('codm-pwa/index.html','utf8');
          const js=fs.readFileSync('codm-pwa/app.js','utf8');
          const sw=fs.readFileSync('codm-pwa/sw.js','utf8');
          for(const term of ['id="rankArt"','id="badgeUnavailable"','id="interactiveRank"']){
            if(!html.includes(term))throw Error('Missing original rank art UI: '+term);
          }
          for(const forbidden of ['id="rankGallery"','id="rankVector"','/rank-art.js']){
            if(html.includes(forbidden)||sw.includes(forbidden))throw Error('Custom rank art still active: '+forbidden);
          }
          if(!js.includes('displayArt("rankArt","badgeUnavailable",player.rankArt)'))throw Error('Live source image no longer used');
          if(!js.includes('Math.min(1,maxWidth/width,maxHeight/height)'))throw Error('Original image might be enlarged above native size');
          if(!js.includes('function allowedArt(raw)'))throw Error('Original image URL validation missing');
          if(fs.existsSync('codm-pwa/rank-art.js'))throw Error('Fake rank insignias not deleted');
          console.log('Only authentic per-user rank images; no invented badges; native resolution limit verified.');
          NODE
