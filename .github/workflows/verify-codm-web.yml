name: Verify CODM web rank art
on:
  push:
    branches: [codm-rank-tracker]
    paths:
      - 'codm-pwa/**'
      - '.github/workflows/verify-codm-web.yml'
  workflow_dispatch:
jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all JavaScript syntax
        run: |
          node --check codm-pwa/app.js
          node --check codm-pwa/rank-art.js
          node --check codm-pwa/sw.js
          node --check codm-pwa/api/player.js
      - name: Render and validate every rank
        run: |
          node <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const code=fs.readFileSync('codm-pwa/rank-art.js','utf8');
          const sandbox={window:{}};
          vm.runInNewContext(code,sandbox);
          const art=sandbox.window.RankArt;
          const expected=['Rookie','Veteran','Elite','Pro','Master','Grand Master','Legendary'];
          if(art.tiers.length!==7)throw Error('Missing ranks');
          for(const rank of expected){
            const resolved=art.resolve(rank+' I');
            if(!resolved||resolved.label!==rank)throw Error('Bad mapping '+rank);
            const svg=art.render(rank==='Legendary'?rank:rank+' IV');
            if(!svg.includes('<svg')||!svg.includes('</svg>')||!svg.includes('var(--badge-edge)'))throw Error('No valid vector for '+rank);
            if(svg.includes('url(#outer)')||svg.includes('url(#inner)')||svg.includes('url(#gem)'))throw Error('Unscoped gradient for '+rank);
            if(rank!=='Legendary'&&!svg.includes('>IV</text>'))throw Error('Incorrect subdivision art '+rank);
          }
          if(!art.render('unrecognized').includes('Unranked'))throw Error('Unknown rank incorrectly represented');
          const html=fs.readFileSync('codm-pwa/index.html','utf8');
          if(!html.includes('/rank-art.js')||!html.includes('id="rankGallery"')||!html.includes('id="rankVector"'))throw Error('Rank UI missing');
          if(html.includes('id="rankArt"'))throw Error('Low-res rank image is still in hero');
          console.log('Seven HD vector ranks, subtiers, unknown fallback and HTML integration verified');
          NODE
